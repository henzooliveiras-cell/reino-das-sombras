<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reino das Sombras - RPG Medieval</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10151a;color:#f4e8c8;
 font-family:Georgia,serif;text-align:center
}
h1{color:#e7b65b;margin:12px}
#hud{
 display:flex;justify-content:center;gap:18px;
 flex-wrap:wrap;padding:10px;background:#202a2e
}
.stat{min-width:100px}
.bar{height:12px;width:145px;background:#481d24;
 border:1px solid #777;margin:4px auto}
.fill{height:100%;width:100%;transition:width .15s}
#hp{background:#e84848}#mp{background:#4288ed}
#xp{background:#d9ad42}
canvas{
 display:block;margin:12px auto;max-width:96vw;
 border:4px solid #b18a4c;background:#243d2d;
 image-rendering:pixelated
}
#controls{color:#d5c9aa;margin:8px}
button{
 background:#65462b;color:#ffe9b4;border:2px solid #c7a15d;
 padding:10px 15px;margin:4px;font-size:15px;cursor:pointer
}
button:hover{background:#8a6035}
#message{min-height:25px;color:#f1c96c}
</style>
</head>
<body>
<h1>⚔ REINO DAS SOMBRAS ⚔</h1>
<div id="hud">
 <div class="stat">❤️ Vida <div class="bar"><div id="hp" class="fill"></div></div><span id="health"></span></div>
 <div class="stat">🔮 Mana <div class="bar"><div id="mp" class="fill"></div></div><span id="mana"></span></div>
 <div class="stat">⭐ Experiência <div class="bar"><div id="xp" class="fill"></div></div><span id="level"></span></div>
 <div class="stat">🪙 Ouro<br><span id="gold">0</span></div>
 <div class="stat">🧪 Poções<br><span id="pots">3</span></div>
 <div class="stat">☠ Abates<br><span id="kills">0</span></div>
</div>
<canvas id="game" width="900" height="570"></canvas>
<div id="message">Explore a floresta. Derrote os monstros para abrir o caminho!</div>
<div id="controls">
 WASD ou setas: mover · Espaço: espada · Q: magia · E: poção
</div>
<div>
 <button onclick="usePotion()">🧪 Usar poção (E)</button>
 <button onclick="castSpell()">🔥 Bola de fogo (Q)</button>
 <button onclick="restart()">🔄 Novo jogo</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const keys={};
let player,enemies,bullets,particles,chests,obstacles;
let bossDefeated=false,gameOver=false,won=false;
let kills=0,gold=0,level=1,xp=0,potions=3;
let attackCooldown=0,spellCooldown=0,damageFlash=0;
let frame=0,worldSeed=12345;

function rand(){
 worldSeed=(worldSeed*1664525+1013904223)>>>0;
 return worldSeed/4294967296;
}
function resetPlayer(){
 player={x:100,y:100,r:15,hp:120,maxHp:120,
 mana:70,maxMana:70,damage:25,speed:3.2,
 inv:0,dirX:1,dirY:0};
}
function restart(){
 worldSeed=12345;frame=0;kills=0;gold=0;
 level=1;xp=0;potions=3;bossDefeated=false;
 gameOver=false;won=false;attackCooldown=0;spellCooldown=0;
 resetPlayer();enemies=[];bullets=[];particles=[];chests=[];
 obstacles=[];
 for(let i=0;i<55;i++){
  let x=rand()*W,y=rand()*H;
  if(Math.hypot(x-100,y-100)<75)continue;
  obstacles.push({x,y,r:10+rand()*13});
 }
 for(let i=0;i<8;i++)spawnEnemy();
 for(let i=0;i<5;i++){
  chests.push({x:100+rand()*700,y:80+rand()*420,open:false});
 }
 say("A floresta está cheia de criaturas. Encontre ouro e sobreviva!");
}
function say(s){document.getElementById("message").textContent=s}
function spawnEnemy(){
 let types=[
  {name:"Slime",color:"#8cda63",hp:40,damage:7,speed:1.05,r:13,xp:15},
  {name:"Goblin",color:"#c4a05a",hp:65,damage:11,speed:1.4,r:14,xp:24},
  {name:"Esqueleto",color:"#ddd8c5",hp:85,damage:14,speed:1.1,r:15,xp:32},
  {name:"Orc",color:"#c65e48",hp:140,damage:20,speed:.8,r:20,xp:48}
 ];
 let t=types[Math.min(3,Math.floor(rand()*(level<3?3:4)))];
 let side=Math.floor(rand()*4),x,y;
 if(side===0){x=0;y=rand()*H}
 if(side===1){x=W;y=rand()*H}
 if(side===2){x=rand()*W;y=0}
 if(side===3){x=rand()*W;y=H}
 enemies.push({...t,x,y,maxHp:t.hp,hp:t.hp,
  attack:0,flash:0,boss:false});
}
function spawnBoss(){
 enemies.push({name:"DRAGÃO DAS TREVAS",x:760,y:285,
  r:39,hp:1100,maxHp:1100,damage:24,speed:1.05,
  color:"#8b2635",xp:500,attack:0,flash:0,boss:true});
 say("⚠ O DRAGÃO DAS TREVAS DESPERTOU! Prepare-se!");
}
function collides(x,y,r,o){
 return Math.hypot(x-o.x,y-o.y)<r+o.r;
}
function movePlayer(){
 let dx=0,dy=0;
 if(keys.w||keys.ArrowUp)dy--;
 if(keys.s||keys.ArrowDown)dy++;
 if(keys.a||keys.ArrowLeft)dx--;
 if(keys.d||keys.ArrowRight)dx++;
 if(dx||dy){
  let l=Math.hypot(dx,dy);dx/=l;dy/=l;
  player.dirX=dx;player.dirY=dy;
  let nx=player.x+dx*player.speed;
  let ny=player.y+dy*player.speed;
  if(nx>player.r&&nx<W-player.r&&
     !obstacles.some(o=>collides(nx,player.y,player.r,o)))player.x=nx;
  if(ny>player.r&&ny<H-player.r&&
     !obstacles.some(o=>collides(player.x,ny,player.r,o)))player.y=ny;
 }
}
function swordAttack(){
 if(attackCooldown>0||gameOver||won)return;
 attackCooldown=22;
 particles.push({x:player.x+player.dirX*30,
  y:player.y+player.dirY*30,r:30,life:9,color:"#ffe7a0"});
 let hit=false;
 for(let e of enemies){
  let dx=e.x-player.x,dy=e.y-player.y;
  let dist=Math.hypot(dx,dy);
  if(dist<player.r+e.r+36&&
    (dist<1||(dx*player.dirX+dy*player.dirY)/dist>.15)){
   hurtEnemy(e,player.damage+Math.floor(level*2));
   hit=true;
  }
 }
 if(hit)say("Golpe certeiro! Continue atacando!");
}
function castSpell(){
 if(gameOver||won||spellCooldown>0)return;
 if(player.mana<25){say("Mana insuficiente!");return}
 player.mana-=25;spellCooldown=38;
 let target=enemies.reduce((a,e)=>
  !a||Math.hypot(e.x-player.x,e.y-player.y)<
  Math.hypot(a.x-player.x,a.y-player.y)?e:a,null);
 if(!target){say("Não há inimigos por perto.");return}
 bullets.push({x:player.x,y:player.y,target,
  speed:5.8,damage:48+level*5});
 say("🔥 Bola de fogo lançada!");
}
function usePotion(){
 if(gameOver||won)return;
 if(potions<=0){say("Você não tem poções!");return}
 if(player.hp===player.maxHp&&player.mana===player.maxMana){
  say("Você já está completamente recuperado.");return;
 }
 potions--;player.hp=Math.min(player.maxHp,player.hp+55);
 player.mana=Math.min(player.maxMana,player.mana+20);
 say("Poção usada: vida e mana recuperadas!");
}
function hurtEnemy(e,dmg){
 if(!enemies.includes(e))return;
 e.hp-=dmg;e.flash=5;
 for(let i=0;i<5;i++)particles.push({
  x:e.x,y:e.y,r:3+rand()*3,life:15,
  vx:(rand()-.5)*4,vy:(rand()-.5)*4,color:"#f5b75d"});
 if(e.hp<=0){
  enemies=enemies.filter(a=>a!==e);
  if(e.boss){
   bossDefeated=true;won=true;
   say("🏆 VITÓRIA! O dragão foi derrotado e o reino está salvo!");
   return;
  }
  kills++;gold+=e.boss?100:Math.floor(5+rand()*13);
  xp+=e.xp;
  if(rand()<.17)potions++;
  while(xp>=level*100){
   xp-=level*100;level++;
   player.maxHp+=18;player.hp=player.maxHp;
   player.maxMana+=10;player.mana=player.maxMana;
   player.damage+=5;player.speed=Math.min(4.6,player.speed+.08);
   say("⭐ NÍVEL "+level+"! Você ficou mais poderoso!");
  }
  if(kills>=12&&!bossDefeated&&!enemies.some(a=>a.boss))spawnBoss();
  else if(!won&&kills%3===0)say("Monstro derrotado! Continue explorando.");
  if(!bossDefeated&&enemies.length<7&&kills<12)spawnEnemy();
 }
}
function update(){
 if(gameOver||won)return;
 frame++;
 if(attackCooldown>0)attackCooldown--;
 if(spellCooldown>0)spellCooldown--;
 if(player.inv>0)player.inv--;
 if(damageFlash>0)damageFlash--;
 movePlayer();
 player.mana=Math.min(player.maxMana,player.mana+.035);
 for(let e of enemies){
  e.attack=Math.max(0,e.attack-1);
  if(e.flash>0)e.flash--;
  let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d>e.r+player.r+2){
   let nx=e.x+dx/d*e.speed,ny=e.y+dy/d*e.speed;
   if(!obstacles.some(o=>collides(nx,ny,e.r,o))){e.x=nx;e.y=ny}
  }else if(e.attack===0&&player.inv===0){
   player.hp-=e.damage;player.inv=36;e.attack=e.boss?48:55;
   say(e.boss?"O DRAGÃO ATACOU!":"Você recebeu dano!");
   if(player.hp<=0){player.hp=0;gameOver=true;say("☠ Você caiu em batalha! Clique em Novo jogo.");}
  }
  if(e.boss&&frame%100===0){
   bullets.push({x:e.x,y:e.y,target:player,speed:3.1,
    damage:16,enemyShot:true});
  }
 }
 for(let b of bullets){
  if(!b.target)continue;
  let dx=b.target.x-b.x,dy=b.target.y-b.y,d=Math.hypot(dx,dy)||1;
  b.x+=dx/d*b.speed;b.y+=dy/d*b.speed;
  if(d< b.target.r+(b.enemyShot?player.r:5)){
   if(b.enemyShot){
    if(player.inv===0){player.hp-=b.damage;player.inv=28;
     if(player.hp<=0){player.hp=0;gameOver=true;
      say("☠ O dragão venceu. Clique em Novo jogo.");}}
   }else hurtEnemy(b.target,b.damage);
   b.target=null;
  }
 }
 bullets=bullets.filter(b=>b.target);
 for(let p of particles){p.x+=p.vx||0;p.y+=p.vy||0;p.life--}
 particles=particles.filter(p=>p.life>0);
 for(let c of chests){
  if(!c.open&&Math.hypot(player.x-c.x,player.y-c.y)<28){
   c.open=true;gold+=25;potions++;
   player.hp=Math.min(player.maxHp,player.hp+15);
   say("🎁 Baú encontrado! +25 ouro e uma poção!");
  }
 }
 draw();updateHud();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#29432d";ctx.fillRect(0,0,W,H);
 // chão medieval
 for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40){
  ctx.fillStyle=((x+y)/40)%2?"#2b4730":"#2e4b32";
  ctx.fillRect(x,y,39,39);
 }
 // caminho de pedra
 ctx.fillStyle="#575344";
 ctx.beginPath();ctx.moveTo(0,460);ctx.lineTo(220,350);
 ctx.lineTo(480,390);ctx.lineTo(900,220);
 ctx.lineTo(900,285);ctx.lineTo(480,455);
 ctx.lineTo(220,415);ctx.lineTo(0,525);ctx.fill();
 for(let o of obstacles){
  ctx.fillStyle="#503b28";ctx.beginPath();
  ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#315f38";ctx.beginPath();
  ctx.arc(o.x-3,o.y-5,o.r*.85,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#417947";ctx.beginPath();
  ctx.arc(o.x-5,o.y-7,o.r*.52,0,Math.PI*2);ctx.fill();
 }
 for(let c of chests){
  ctx.fillStyle=c.open?"#5a4b31":"#9b5b24";
  ctx.fillRect(c.x-10,c.y-8,20,16);
  ctx.strokeStyle="#edc75d";ctx.lineWidth=3;
  ctx.strokeRect(c.x-10,c.y-8,20,16);
  if(!c.open){ctx.fillStyle="#ffe7a0";ctx.fillRect(c.x-2,c.y-3,4,5)}
 }
 for(let e of enemies){
  ctx.fillStyle=e.flash?"#fff":e.color;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#161313";
  ctx.fillRect(e.x-e.r*.5,e.y-3,4,4);
  ctx.fillRect(e.x+e.r*.25,e.y-3,4,4);
  if(e.boss){
   ctx.fillStyle="#3b171c";
   ctx.fillRect(e.x-45,e.y-e.r-17,90,8);
   ctx.fillStyle="#f13c48";
   ctx.fillRect(e.x-45,e.y-e.r-17,90*Math.max(0,e.hp/e.maxHp),8);
   ctx.fillStyle="#fff0d0";ctx.font="13px Georgia";
   ctx.fillText(e.name,e.x-75,e.y-e.r-23);
   ctx.fillStyle="#6f2531";
   ctx.beginPath();ctx.moveTo(e.x-24,e.y-22);
   ctx.lineTo(e.x-39,e.y-43);ctx.lineTo(e.x-12,e.y-29);ctx.fill();
   ctx.beginPath();ctx.moveTo(e.x+24,e.y-22);
   ctx.lineTo(e.x+39,e.y-43);ctx.lineTo(e.x+12,e.y-29);ctx.fill();
  }else{
   ctx.fillStyle="#e94e48";
   ctx.fillRect(e.x-e.r,e.y-e.r-9,2*e.r,4);
   ctx.fillStyle="#68d56a";
   ctx.fillRect(e.x-e.r,e.y-e.r-9,2*e.r*Math.max(0,e.hp/e.maxHp),4);
  }
 }
 for(let b of bullets){
  ctx.fillStyle=b.enemyShot?"#d44a55":"#ff9f35";
  ctx.beginPath();ctx.arc(b.x,b.y,b.enemyShot?8:7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ffe8a0";ctx.beginPath();
  ctx.arc(b.x-2,b.y-2,3,0,Math.PI*2);ctx.fill();
 }
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/15);ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
 }
 // cavaleiro
 ctx.fillStyle=player.inv>0&&frame%6<3?"#fff":"#b9c5cf";
 ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#26303c";
 ctx.fillRect(player.x-9,player.y-5,18,12);
 ctx.fillStyle="#d8bd83";
 ctx.fillRect(player.x+player.dirX*9-3,player.y+player.dirY*9-3,6,6);
 // espada
 ctx.strokeStyle="#e9e7db";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(player.x+player.dirX*8,player.y+player.dirY*8);
 ctx.lineTo(player.x+player.dirX*25-player.dirY*4,
 player.y+player.dirY*25+player.dirX*4);ctx.stroke();
 if(gameOver||won){
  ctx.fillStyle="#000b";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";ctx.fillStyle=won?"#f7d477":"#ed6969";
  ctx.font="bold 42px Georgia";
  ctx.fillText(won?"REINO SALVO!":"FIM DE JOGO",W/2,H/2);
  ctx.fillStyle="#fff";ctx.font="20px Georgia";
  ctx.fillText("Abates: "+kills+"  |  Nível: "+level+"  |  Ouro: "+gold,W/2,H/2+40);
  ctx.textAlign="left";
 }
}
function updateHud(){
 document.getElementById("hp").style.width=100*player.hp/player.maxHp+"%";
 document.getElementById("mp").style.width=100*player.mana/player.maxMana+"%";
 document.getElementById("xp").style.width=100*xp/(level*100)+"%";
 document.getElementById("health").textContent=Math.ceil(player.hp)+"/"+player.maxHp;
 document.getElementById("mana").textContent=Math.floor(player.mana)+"/"+player.maxMana;
 document.getElementById("level").textContent="Nível "+level+" ("+xp+"/"+level*100+")";
 document.getElementById("gold").textContent=gold;
 document.getElementById("pots").textContent=potions;
 document.getElementById("kills").textContent=kills+"/12";
}
document.addEventListener("keydown",e=>{
 let k=e.key.length===1?e.key.toLowerCase():e.key;
 keys[k]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(e.repeat)return;
 if(e.code==="Space")swordAttack();
 if(k==="q")castSpell();
 if(k==="e")usePotion();
});
document.addEventListener("keyup",e=>{
 keys[e.key.length===1?e.key.toLowerCase():e.key]=false;
});
canvas.addEventListener("click",e=>{
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*W/r.width;
 const y=(e.clientY-r.top)*H/r.height;
 let dx=x-player.x,dy=y-player.y,d=Math.hypot(dx,dy)||1;
 player.dirX=dx/d;player.dirY=dy/d;swordAttack();
});
restart();
function loop(){update();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
